[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "stale-tools"
version = "0.1.0"
description = "Code and per-cell records for the stale-tools probe (anonymous NeurIPS 2026 submission)."
requires-python = ">=3.10"
readme = "README.md"
dependencies = [
    "openai>=1.40",
    "numpy>=1.26",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
apibank = ["huggingface_hub>=0.24"]

[project.scripts]
stale-tools = "stale_tools.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/stale_tools"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    "pre-commit>=3.7",
]

[tool.ruff]
line-length = 100
indent-width = 4
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
ignore = ["E402", "E741"]  # E741: 'l' as iteration variable is fine in line readers
fixable = ["ALL"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-p no:warnings"
